<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | DenIA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <canvas id="bg-canvas"></canvas>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <img src="assets/img/WhatsApp Image 2025-12-09 at 10.33.34.jpeg" alt="DenIA Logo" class="login-logo">
                <h2>Bienvenido</h2>
                <p>Ingresa a tu panel de control inmobiliario</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Corporativo</label>
                    <input type="email" id="email" placeholder="agente@inmobiliaria.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary full-width-btn" id="login-btn">
                    Ingresar al Dashboard
                </button>
            </form>

            <div class="login-footer">
                <p>¿Aún no tienes cuenta? <a href="signup.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
     <script src="/js/login.js"></script>  </body>
</html>
